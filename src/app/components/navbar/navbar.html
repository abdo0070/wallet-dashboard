<header class="w-full  bg-slate-900/80 backdrop-blur-xl border-b border-slate-800 text-slate-100 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto  px-4 sm:px-6 lg:px-8 h-24 flex items-center justify-between">
    
    <!-- Logo & Brand -->
    <div class="flex items-center gap-3">
      <a href="#" class="flex items-center gap-2.5 group">
        <div class="flex items-center justify-center w-9 h-9 bg-indigo-600/10 border border-indigo-500/30 rounded-lg text-indigo-400 group-hover:bg-indigo-600/20 transition">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v9a2 2 0 002 2z" />
          </svg>
        </div>
        <span class="text-lg font-bold text-white tracking-tight">Wallet</span>
      </a>

      <!-- Network Status Indicator -->
      <div class="hidden sm:flex items-center gap-2 px-2.5 py-1 bg-emerald-500/10 border border-emerald-500/20 rounded-full text-[11px] font-medium text-emerald-400 ml-2">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
        Mainnet
      </div>
    </div>

    <!-- Navigation Links -->
    <nav class="hidden md:flex items-center gap-6 text-sm font-medium text-slate-400">
      <a href="#" class="text-white transition">Dashboard</a>
      <a href="#" class="hover:text-white transition">Assets</a>
      <a href="#" class="hover:text-white transition">Swap</a>
      <a href="#" class="hover:text-white transition">History</a>
    </nav>

    <!-- Header Actions -->
    <div class="flex items-center gap-3">
      <button type="button" class="hidden sm:inline-flex items-center justify-center bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs py-2 px-4 rounded-xl shadow-lg shadow-indigo-600/20 transition">
        Connect Wallet
      </button>

      <!-- Mobile Menu Button -->
      <button type="button" class="md:hidden text-slate-400 hover:text-white p-2">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>
    </div>

  </div>
