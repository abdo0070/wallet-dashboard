<header
  class="sticky top-0 z-50 w-full border-b border-slate-800/80 bg-slate-950/85 text-slate-100 backdrop-blur-xl"
>
  <div class="mx-auto flex h-20 max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
    <!-- Logo & Brand -->
    <a href="#" class="group flex items-center gap-3">
      <div
        class="flex h-10 w-10 items-center justify-center rounded-xl border border-indigo-500/30 bg-indigo-500/10 text-indigo-400 shadow-lg shadow-indigo-500/10 transition-all duration-300 group-hover:border-indigo-400/50 group-hover:bg-indigo-500/20 group-hover:text-indigo-300 group-hover:shadow-indigo-500/20"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3 10h18M7 15h1m4 0h1m-7 4h12a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v9a2 2 0 002 2z"
          />
        </svg>
      </div>

      <div class="flex flex-col">
        <span
          class="text-xl font-bold tracking-tight text-white transition-colors group-hover:text-indigo-300"
        >
          Wallet
        </span>
        <span
          class="hidden text-[10px] font-medium uppercase tracking-widest text-slate-500 sm:block"
        >
          Smart Finance
        </span>
      </div>
    </a>

    <!-- Navigation -->
    <nav class="hidden items-center gap-2 md:flex">
      @for (link of navLinks; track $index) {
        <a
          [routerLink]="link"
          class="rounded-lg px-4 py-2 capitalize text-sm font-medium transition-all duration-200 hover:bg-indigo-500/15 hover:text-indigo-300"
          routerLinkActive="bg-indigo-500/10 text-indigo-400"
        >
          {{ link }}
        </a>
      }
    </nav>

    <!-- Header Actions -->
    <div class="flex items-center gap-3">
      <!-- Login -->
      <button
        type="button"
        class="hidden rounded-lg border border-slate-700 bg-slate-900/70 px-4 py-2 text-sm font-medium text-slate-300 transition-all duration-200 hover:border-slate-600 hover:bg-slate-800 hover:text-white sm:inline-flex"
        routerLink="/login"
      >
        Login
      </button>

      <!-- Register -->
      <button
        type="button"
        class="hidden rounded-lg bg-indigo-600 px-5 py-2 text-sm font-semibold text-white shadow-lg shadow-indigo-600/20 transition-all duration-200 hover:bg-indigo-500 hover:shadow-indigo-500/30 active:scale-95 sm:inline-flex"
      >
        Register
      </button>

      <!-- Mobile Menu -->
      <button
        type="button"
        class="rounded-lg border border-slate-800 p-2 text-slate-400 transition-all duration-200 hover:border-slate-700 hover:bg-slate-800 hover:text-white md:hidden"
      >
        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>
      </button>
    </div>
  </div>
</header>
