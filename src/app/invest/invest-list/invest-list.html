<div class="w-full font-medium text-white rounded-xl p-6 overflow-auto">
  <table class="w-full text-left border-collapse border border-gray-700 rounded-lg overflow-hidden">
    <thead>
      <tr class="border-b border-gray-700 text-gray-400 text-sm uppercase tracking-wide">
        <th class="py-3 px-4 border border-gray-700">Invest Type</th>
        <th class="py-3 px-4 border border-gray-700">Invest Amount</th>
        <th class="py-3 px-4 border border-gray-700">Invest Value</th>
        <th class="py-3 px-4 border border-gray-700 text-right">Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (item of investments(); track item.id) {
        <tr class="hover:bg-gray-800/50 transition-colors">
          <td class="py-3 px-4 border border-gray-700">{{ item.investmentType }}</td>
          <td class="py-3 px-4 border border-gray-700">{{ item.amount }}</td>
          <td class="py-3 px-4 border border-gray-700">{{ item.value }}</td>
          <td class="py-3 px-4 border border-gray-700 text-right space-x-2">
            <button
              class="px-3 py-1 cursor-pointer rounded-md bg-blue-500/10 text-blue-400 hover:bg-blue-500/20 transition-colors text-sm"
            >
              Edit
            </button>
            <button
              class="px-3 py-1 cursor-pointer rounded-md bg-red-500/10 text-red-400 hover:bg-red-500/20 transition-colors text-sm"
            >
              Delete
            </button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="4" class="py-4 text-center text-gray-400">No investments found.</td>
        </tr>
      }
    </tbody>
  </table>
</div>
