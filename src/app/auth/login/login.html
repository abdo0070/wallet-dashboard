<div class="h-full flex items-center w-full mt-14">
  <!-- Wallet Login Component Container -->
  <div
    class="relative w-full max-w-lg mx-auto bg-slate-900/90 backdrop-blur-xl border border-slate-800 rounded-2xl shadow-2xl p-6 sm:p-8 text-slate-100 font-sans overflow-hidden"
  >
    <!-- Background Glow Effects -->
    <div
      class="absolute -top-24 -left-24 w-72 h-72 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"
    ></div>
    <div
      class="absolute -bottom-24 -right-24 w-72 h-72 bg-violet-600/20 rounded-full blur-3xl pointer-events-none"
    ></div>

    <!-- Header / Brand -->
    <div class="text-center mb-6 relative z-10">
      <div
        class="inline-flex items-center justify-center w-12 h-12 bg-indigo-600/10 border border-indigo-500/30 rounded-xl mb-3 text-indigo-400 shadow-inner"
      >
        <!-- Wallet Icon -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="w-6 h-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3 10h18M7 15h1m4 0h1m-7 4h12a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v9a2 2 0 002 2z"
          />
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-white tracking-tight">Welcome to Wallet</h2>
      <p class="text-sm text-slate-400 mt-1">Connect your crypto wallet to continue</p>
    </div>

    <!-- Email Login Form -->
    <form #loginForm="ngForm" (ngSubmit)="onClickLogin(loginForm)" class="space-y-4 relative z-10" novalidate>
      <div>
        <label
          for="wallet-email"
          class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5"
          >Email Address</label
        >
        <input
          type="email"
          id="wallet-email"
          name="email"
          required
          email
          [(ngModel)]="email"
          #emailInput="ngModel"
          placeholder="name@example.com"
          class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition duration-200 text-sm"
        />
        <!-- Validation Error Message -->
        <p *ngIf="emailInput.invalid && emailInput.touched" class="mt-1 text-xs text-red-400">
          <span *ngIf="emailInput.errors?.['required']">Email is required.</span>
          <span *ngIf="emailInput.errors?.['email']">Please enter a valid email address.</span>
        </p>
      </div>

      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label
            for="wallet-password"
            class="block text-xs font-semibold text-slate-300 uppercase tracking-wider"
            >Password</label
          >
          <a href="#" class="text-xs text-indigo-400 hover:text-indigo-300 transition">Forgot?</a>
        </div>
        <input
          type="password"
          id="wallet-password"
          name="password"
          required
          [(ngModel)]="password"
          #passwordInput="ngModel"
          placeholder="••••••••"
          class="w-full bg-slate-950/60 border border-slate-800 rounded-xl px-4 py-2.5 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition duration-200 text-sm"
        />
        <!-- Validation Error Message -->
        <p *ngIf="passwordInput.invalid && passwordInput.touched" class="mt-1 text-xs text-red-400">
          Password is required.
        </p>
      </div>

      <div class="flex items-center">
        <input
          type="checkbox"
          id="wallet-remember"
          name="rememberMe"
          [(ngModel)]="rememberMe"
          class="w-4 h-4 rounded border-slate-800 bg-slate-950 text-indigo-600 focus:ring-indigo-500 focus:ring-offset-slate-900"
        />
        <label for="wallet-remember" class="ml-2 text-xs text-slate-400"
          >Remember this device</label
        >
      </div>

      <button
        type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-indigo-600/25 transition duration-200 text-sm mt-2"
      >
        Sign In
      </button>
    </form>

    <!-- Footer link -->
    <p class="text-center text-xs text-slate-500 mt-6 relative z-10">
      Don't have a wallet?
      <a href="#" class="text-indigo-400 font-medium hover:underline">Create Account</a>
    </p>
  </div>
</div>
