<div class="py-6 bg-slate-950 px-4 text-white sm:px-6">
  <div class="flex items-center justify-center">
    <!-- Register Card -->
    <div
      class="relative w-full max-w-md overflow-hidden rounded-2xl border border-slate-800 bg-slate-900/95 px-6 shadow-2xl shadow-black/30 sm:px-8 sm:py-9"
    >
      <!-- Gradient Glow -->
      <div
        class="pointer-events-none absolute -right-24 -bottom-24 h-64 w-64 rounded-full bg-indigo-600/20 blur-3xl"
      ></div>

      <div
        class="pointer-events-none absolute -left-24 -top-24 h-56 w-56 rounded-full bg-indigo-700/20 blur-3xl"
      ></div>

      <!-- Content -->
      <div class="relative z-10">
        <!-- Wallet Icon -->
        <div class="mb-4 flex justify-center">
          <div
            class="flex h-12 w-12 items-center justify-center rounded-xl border border-indigo-500/50 bg-indigo-500/5 text-indigo-400"
          >
            <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <rect width="18" height="14" x="3" y="5" rx="2" stroke-width="1.8" />

              <path stroke-linecap="round" stroke-width="1.8" d="M16 13h2" />

              <path stroke-linecap="round" stroke-width="1.8" d="M3 8h18" />
            </svg>
          </div>
        </div>

        <!-- Heading -->
        <div class="text-center">
          <h1 class="text-2xl font-bold tracking-tight sm:text-[26px]">Create your Wallet</h1>

          <p class="mt-1 text-sm text-slate-400">
            Create an account to start tracking your investments
          </p>
        </div>

        <!-- Form -->
        <form 
        [formGroup]="registerForm" 
        (ngSubmit)="onRegisterSubmit(registerForm.value)"
        class="mt-7 space-y-4">
          <!-- Full Name -->
          <div>
            <label
              for="name"
              class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-slate-300"
            >
              username
            </label>

            <input
              id="name"
              name="name"
              type="text"
              formControlName="usernameControl"
              placeholder="Mohamed Ahmed"
              autocomplete="name"
              class="h-11 w-full rounded-xl border border-slate-700 bg-slate-950/80 px-4 text-sm text-white placeholder-slate-600 outline-none transition focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
            />
          </div>

          <!-- Email -->
          <div>
            <label
              for="email"
              class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-slate-300"
            >
              Email Address
            </label>

            <input
              id="email"
              name="email"
              type="email"
              formControlName="emailControl"
              placeholder="you@example.com"
              autocomplete="email"
              class="h-11 w-full rounded-xl border border-slate-700 bg-slate-950/80 px-4 text-sm text-white placeholder-slate-600 outline-none transition focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
            />
          </div>

          <!-- Password -->
          <div>
            <label
              for="password"
              class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-slate-300"
            >
              Password
            </label>

            <div class="relative">
              <input
                id="password"
                name="password"
                type="password"
                formControlName="passwordControl"
                placeholder="••••••••"
                autocomplete="new-password"
                class="h-11 w-full rounded-xl border border-slate-700 bg-slate-950/80 px-4 pr-12 text-sm text-white placeholder-slate-600 outline-none transition focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
              />

              <!-- Show Password -->
              <button
                type="button"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 transition hover:text-slate-300"
              >
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.8"
                    d="M2.458 12C3.732 7.943 7.523 5
                   12 5c4.477 0 8.268 2.943
                   9.542 7-1.274 4.057-5.065
                   7-9.542 7-4.477 0-8.268-2.943
                   -9.542-7z"
                  />

                  <circle cx="12" cy="12" r="3" stroke-width="1.8" />
                </svg>
              </button>
            </div>
          </div>

          <!-- Confirm Password -->
          <div>
            <label
              for="confirmPassword"
              class="mb-1.5 block text-xs font-semibold uppercase tracking-wide text-slate-300"
            >
              Confirm Password
            </label>

            <input
              id="confirmPassword"
              name="confirmPassword"
              formControlName="confirmPassControl"
              type="password"
              placeholder="••••••••"
              autocomplete="new-password"
              class="h-11 w-full rounded-xl border border-slate-700 bg-slate-950/80 px-4 text-sm text-white placeholder-slate-600 outline-none transition focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500"
            />
          </div>

          <!-- Terms -->
          <div class="flex items-start gap-2 pt-1">
            <input
              id="terms"
              name="terms"
              type="checkbox"
              formControlName="termsControl"
              class="mt-0.5 h-4 w-4 shrink-0 cursor-pointer rounded border-slate-700 bg-slate-950 text-indigo-600 focus:ring-indigo-500"
            />

            <label for="terms" class="text-xs leading-5 text-slate-400">
              I agree to the
              <a href="#" class="text-indigo-400 hover:text-indigo-300"> Terms of Service </a>
              and
              <a href="#" class="text-indigo-400 hover:text-indigo-300"> Privacy Policy </a>.
            </label>
          </div>

          <!-- Register Button -->
          <button
            type="submit"
            class="h-11 w-full rounded-xl bg-indigo-600 text-sm font-semibold text-white shadow-lg shadow-indigo-600/20 transition hover:bg-indigo-500 active:scale-[0.99] focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 focus:ring-offset-slate-950"
          >
            Create Account
          </button>
        </form>

        <!-- Login -->
        <div class="mt-6 text-center">
          <p class="text-xs text-slate-500 sm:text-sm">
            Already have a wallet?

            <a
              routerLink="/login"
              class="font-medium text-indigo-400 transition hover:text-indigo-300"
            >
              Sign In
            </a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
